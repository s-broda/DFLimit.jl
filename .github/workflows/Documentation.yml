# The documentation (Documenter, docs/make.jl): built on every push to main, on tags and on pull requests (and by hand:
# Actions tab, "Run workflow"), and deployed to the branch gh-pages from main (the development version, dev/) and from
# tags (the released versions, v0.5.0/ and stable/). The deployment uses the GITHUB_TOKEN that GitHub gives every run,
# with the write permission below: no deploy key and no secret of the repository. A pull request is built, not deployed.
# A push whose head commit message contains [skip ci] starts no run (GitHub's own rule).
name: Documentation

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write     # julia-actions/cache deletes the old caches it has created
      contents: write    # deploydocs pushes to the branch gh-pages
      statuses: write    # deploydocs sets the commit status of the deployment
    env:
      JULIA_NUM_THREADS: auto
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install the documentation's dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path = pwd()))
          Pkg.instantiate()
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
